name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore workflow/backend/BibliotecaVirtual.slnx
      - run: dotnet build --no-restore --configuration Release workflow/backend/BibliotecaVirtual.slnx

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workflow/frontend/package-lock.json
      - run: npm ci
        working-directory: workflow/frontend
      - run: npm run build
        working-directory: workflow/frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000
          VITE_CHATBOT_API_BASE_URL: http://localhost:8000

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi uvicorn langchain langchain-openai langgraph httpx pydantic pytest pytest-asyncio mcp fastmcp
      - run: python -m pytest tests
        working-directory: workflow/chatbot
      - run: python -m pytest tests
        working-directory: workflow/mcp/biblioteca-mcp
      - run: python -m pytest tests
        working-directory: workflow/mcp/open-library-mcp
      - run: python -m pytest tests
        working-directory: workflow/mcp/security-audit-mcp
        env:
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_TIMEOUT_SECONDS: '10'
