services:
  backend:
    build:
      context: workflow/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/database/BibliotecaVirtual.db
    volumes:
      - database_data:/app/database

  frontend:
    build:
      context: workflow/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  chatbot:
    build:
      context: workflow/chatbot
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

volumes:
  database_data:
