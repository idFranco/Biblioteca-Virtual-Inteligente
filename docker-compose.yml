services:
  backend:
    image: biblioteca-virtual-backend:stable
    build:
      context: workflow/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:?Set ASPNETCORE_ENVIRONMENT in the .env file (e.g. Development)}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:?Set ASPNETCORE_URLS in the .env file (e.g. http://+:5000)}
      - SQLITE_DATA_SOURCE=${SQLITE_DATA_SOURCE:?Set SQLITE_DATA_SOURCE in the .env file (SQLite path, e.g. /app/database/BibliotecaVirtual.db)}
      - Jwt__Key=${JWT__KEY:?Set JWT__KEY in the .env file (>= 32 bytes, HS256)}
      - Jwt__Issuer=${JWT__ISSUER:?Set JWT__ISSUER in the .env file (e.g. BibliotecaVirtual)}
      - Jwt__Audience=${JWT__AUDIENCE:?Set JWT__AUDIENCE in the .env file (e.g. BibliotecaVirtual)}
      - Cors__Origins=${CORS_ORIGINS:?Set CORS_ORIGINS in the .env file (e.g. http://localhost:5173)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Set ADMIN_EMAIL in the .env file}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      - AUTH_RATE_LIMIT_PER_MINUTE=${AUTH_RATE_LIMIT_PER_MINUTE:?Set AUTH_RATE_LIMIT_PER_MINUTE in the .env file (e.g. 10)}
      - Notifications__CheckIntervalSeconds=${NOTIFICATIONS__CHECK_INTERVAL_SECONDS:?Set NOTIFICATIONS__CHECK_INTERVAL_SECONDS in the .env file (e.g. 3600)}
    volumes:
      - database_data:/app/database

  frontend:
    image: biblioteca-virtual-frontend:stable
    build:
      context: workflow/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in the .env file (e.g. http://localhost:5000)}
        VITE_CHATBOT_API_BASE_URL: ${VITE_CHATBOT_API_BASE_URL:?Set VITE_CHATBOT_API_BASE_URL in the .env file (e.g. http://localhost:8000)}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  chatbot:
    image: biblioteca-virtual-chatbot:stable
    build:
      context: .
      dockerfile: workflow/chatbot/Dockerfile
    environment:
      - HOST=${CHATBOT_HOST:?Set CHATBOT_HOST in the .env file (e.g. 0.0.0.0)}
      - PORT=${CHATBOT_PORT:?Set CHATBOT_PORT in the .env file (e.g. 8000)}
      - API_KEY_GROQ=${API_KEY_GROQ:?Set API_KEY_GROQ in the .env file}
      - BIBLIOTECA_MCP_COMMAND=${BIBLIOTECA_MCP_COMMAND:?Set BIBLIOTECA_MCP_COMMAND in the .env file (e.g. python /app/workflow/mcp/biblioteca-mcp/server.py)}
      - SECURITY_AUDIT_MCP_COMMAND=${SECURITY_AUDIT_MCP_COMMAND:?Set SECURITY_AUDIT_MCP_COMMAND in the .env file (e.g. python /app/workflow/mcp/security-audit-mcp/server.py)}
      - OPEN_LIBRARY_MCP_COMMAND=${OPEN_LIBRARY_MCP_COMMAND:?Set OPEN_LIBRARY_MCP_COMMAND in the .env file (e.g. python /app/workflow/mcp/open-library-mcp/server.py)}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in the .env file (e.g. http://localhost:5173)}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:?Set OLLAMA_BASE_URL in the .env file (e.g. http://host.docker.internal:11434/v1)}
      - OLLAMA_MODEL=${OLLAMA_MODEL:?Set OLLAMA_MODEL in the .env file (e.g. llama3.2)}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:?Set LLM_TIMEOUT_SECONDS in the .env file (e.g. 120)}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - GROQ_MODEL=${GROQ_MODEL:?Set GROQ_MODEL in the .env file (e.g. openai/gpt-oss-20b)}
      - GROQ_TIMEOUT_SECONDS=${GROQ_TIMEOUT_SECONDS:?Set GROQ_TIMEOUT_SECONDS in the .env file (e.g. 10)}
      - CHAT_MEMORY_DB_PATH=${CHAT_MEMORY_DB_PATH:?Set CHAT_MEMORY_DB_PATH in the .env file (e.g. /app/database/chat_memory.db)}
    # DATABASE_PATH / AUDIT_DATABASE_PATH se resuelven desde este archivo en disco
    # (env_file NO consulta el entorno del shell), de modo que los exports de dev
    # del host no pueden sombrear las rutas in-image (/app/database/...).
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - database_data:/app/database
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  database_data:
